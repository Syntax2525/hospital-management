<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharmacy MediFlow HMS</title>
  <link rel="stylesheet" href="styles/pharmacy.css" />
</head>
<body data-page="pharmacy">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="hms-top-accent"></div>
  <aside class="hms-sidebar" id="hms-sidebar" aria-label="Primary navigation"></aside>
  <div class="hms-sidebar-backdrop" id="hms-sidebar-backdrop"></div>
  <div class="hms-shell">
    <header class="hms-topbar">
      <div class="hms-topbar__left">
        <button type="button" class="hms-menu-toggle" id="hms-menu-toggle" aria-label="Open navigation menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="hms-search">
          <span class="material-symbols-outlined" aria-hidden="true">search</span>
          <label class="visually-hidden" for="global-search">Search</label>
          <input type="search" id="global-search" placeholder="Search prescriptionsâ€¦" />
        </div>
      </div>
      <h1 class="hms-page-title" id="hms-page-title">Pharmacy</h1>
      <div class="hms-topbar__actions">
        <div class="hms-notify-wrap">
          <button type="button" class="hms-icon-btn" id="hms-notify-btn">
            <span class="material-symbols-outlined">notifications</span>
          </button>
          <div class="hms-notify-panel" id="hms-notify-panel" role="region" aria-label="Notifications">
            <h3>Notifications</h3>
            <div class="hms-notify-item">Loading notifications...</div>
          </div>
        </div>
      </div>
    </header>
    <main id="main" class="hms-main">
      <p id="pharmacy-context" class="hms-card hms-muted" hidden></p>
      <div class="hms-grid hms-grid--stats">
        <article class="hms-card">
          <div class="hms-stat__value">0</div>
          <div class="hms-stat__label">Pending dispensations</div>
        </article>
        <article class="hms-card">
          <div class="hms-stat__value">0</div>
          <div class="hms-stat__label">Low stock alerts</div>
        </article>
        <article class="hms-card">
          <div class="hms-stat__value">0</div>
          <div class="hms-stat__label">SKU in stock</div>
        </article>
      </div>

      <section class="hms-card hms-section-gap">
        <h2 class="hms-title">Dispensing queue</h2>
        <div class="hms-table-wrap">
          <table class="hms-table">
            <thead>
              <tr>
                <th>Rx ID</th>
                <th>Patient</th>
                <th>Medication</th>
                <th></th>
              </tr>
            </thead>
            <tbody>            <tr><td colspan="4" class="hms-muted">Loading dispensing queue...</td></tr>           </tbody>
          </table>
        </div>
      </section>
    </main>
    <footer class="hms-footer">
      <p>© MediFlow HMS · Pharmacy</p>
    </footer>
  </div>
  <script src="scripts/app.js" defer></script>
  <script src="scripts/pharmacy.js" defer></script>
</body>
</html>
