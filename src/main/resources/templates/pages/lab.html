<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laboratory — MediFlow HMS</title>
  <link rel="stylesheet" href="styles/lab.css" />
</head>
<body data-page="lab">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="hms-top-accent"></div>
  <aside class="hms-sidebar" id="hms-sidebar" aria-label="Primary navigation"></aside>
  <div class="hms-sidebar-backdrop" id="hms-sidebar-backdrop"></div>
  <div class="hms-shell">
    <header class="hms-topbar">
      <div class="hms-topbar__left">
        <button type="button" class="hms-menu-toggle" id="hms-menu-toggle" aria-label="Open navigation menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="hms-search">
          <span class="material-symbols-outlined" aria-hidden="true">search</span>
          <label class="visually-hidden" for="global-search">Search</label>
          <input type="search" id="global-search" placeholder="Search test requests…" />
        </div>
      </div>
      <h1 class="hms-page-title" id="hms-page-title">Laboratory</h1>
      <div class="hms-topbar__actions">
        <div class="hms-notify-wrap">
          <button type="button" class="hms-icon-btn" id="hms-notify-btn">
            <span class="material-symbols-outlined">notifications</span>
          </button>
          <div class="hms-notify-panel" id="hms-notify-panel" role="region" aria-label="Notifications">
            <h3>Notifications</h3>
            <div class="hms-notify-item">Loading notifications...</div>
          </div>
        </div>
      </div>
    </header>
    <main id="main" class="hms-main">
      <div class="hms-card-head">
        <div>
          <h2 class="hms-display">Laboratory queue</h2>
          <p class="hms-muted" id="lab-patient-line">Loading context…</p>
        </div>
        <button type="button" class="hms-btn hms-btn--secondary" id="lab-refresh">Refresh list</button>
      </div>

      <section class="hms-card hms-section-gap">
        <h3 class="hms-title">Pending / requested tests</h3>
        <ul class="hms-lab-queue hms-thin-scroll" id="lab-request-list"></ul>
      </section>

      <section class="hms-grid hms-grid--stats hms-section-gap" aria-label="Lab metrics">
        <article class="hms-card">
          <div class="hms-stat__value">0</div>
          <div class="hms-stat__label">Pending tests</div>
        </article>
        <article class="hms-card">
          <div class="hms-stat__value">0</div>
          <div class="hms-stat__label">Completed (week)</div>
        </article>
        <article class="hms-card">
          <div class="hms-stat__value">0</div>
          <div class="hms-stat__label">STAT queue</div>
        </article>
      </section>
    </main>
    <footer class="hms-footer">
      <p>© MediFlow HMS · Laboratory</p>
    </footer>
  </div>
  <script src="scripts/app.js" defer></script>
  <script src="scripts/lab.js" defer></script>
</body>
</html>
