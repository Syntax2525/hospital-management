# =============================================
# SERVER CONFIGURATION
# =============================================
server.port=8083
server.servlet.context-path=/

# =============================================
# DATABASE CONFIGURATION (MySQL)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3311/hospital?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Tyson@2525

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Initial application account used by the data bootstrapper.
hms.bootstrap.admin-email=admin@mediflow.local
hms.bootstrap.admin-password=admin123

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# =============================================
# SPRING DOC (Swagger UI)
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# =============================================
